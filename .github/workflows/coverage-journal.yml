name: coverage-journal

on:
  schedule:
    - cron: "35 21 * * 1-5"
    - cron: "35 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Lock tomorrow's ranges and grade elapsed sessions
        run: npx tsx scripts/coverage-journal.ts
      - name: Commit the journal only when it changed
        run: |
          if git diff --quiet -- data/coverage-journal.json; then
            echo "journal unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/coverage-journal.json
          git commit -m "chore: append coverage journal $(date -u +%Y-%m-%dT%H:%MZ)"
          git push