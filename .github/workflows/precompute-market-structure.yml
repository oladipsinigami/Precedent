name: Refresh market-structure snapshot

on:
  schedule:
    # 05:15 UTC daily, after the prior US cash close has settled.
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-structure-precompute
  cancel-in-progress: false

env:
  MARKET_STRUCTURE_UNIVERSE_LIMIT: "500"

jobs:
  precompute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Recompute RMT market-structure snapshot
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run precompute

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-structure.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh market-structure snapshot"
          git push
